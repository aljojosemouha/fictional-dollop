name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force

          # Disable Network Level Authentication (NLA)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force

          # ✅ الإصلاح: استخدام Negotiate (2) بدلاً من RDP Security Layer (0)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 2 -Force

          # ✅ إضافة: ضبط مستوى التشفير إلى High
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'MinEncryptionLevel' -Value 3 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          # Allow incoming TCP connections on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          # Restart the Remote Desktop service to apply changes
          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 5

          # ✅ التحقق من أن الخدمة تعمل
          $svc = Get-Service -Name TermService
          Write-Host "TermService Status: $($svc.Status)"
          if ($svc.Status -ne 'Running') {
              Write-Error "TermService is not running!"
              exit 1
          }

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }

          $rawPassword  = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password   = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators"       -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          # Store credentials for later steps
          "RDP_USER=RDP"           | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl         = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP    = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

          # ✅ التحقق من إعدادات RDP الفعلية
          $rdpSettings = Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Write-Host "SecurityLayer:     $($rdpSettings.SecurityLayer)   (expected: 2)"
          Write-Host "UserAuthentication: $($rdpSettings.UserAuthentication) (expected: 0)"
          Write-Host "MinEncryptionLevel: $($rdpSettings.MinEncryptionLevel) (expected: 3)"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel the workflow to terminate"
              Start-Sleep -Seconds 300
          }

      # ============================================================
      # 🧹 خطوات التنظيف (تُنفَّذ دائماً حتى لو فشل الـ workflow)
      # ============================================================
      - name: Cleanup - Disconnect Tailscale
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "Disconnecting Tailscale..."
          if (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe") {
              & "$env:ProgramFiles\Tailscale\tailscale.exe" down
              & "$env:ProgramFiles\Tailscale\tailscale.exe" logout
              Write-Host "Tailscale disconnected and logged out."
          } else {
              Write-Host "Tailscale not installed, skipping."
          }

      - name: Cleanup - Remove RDP User
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "Removing RDP user..."
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
              Write-Host "User 'RDP' removed."
          } else {
              Write-Host "User 'RDP' does not exist, skipping."
          }

      - name: Cleanup - Remove Firewall Rule
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "Removing firewall rule..."
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          Write-Host "Firewall rule removed."

      - name: Cleanup - Disable RDP
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "Disabling RDP..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Force
          Write-Host "RDP disabled."

      - name: Cleanup - Uninstall Tailscale
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "Uninstalling Tailscale..."
          $tsReg = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                   Where-Object { $_.DisplayName -like "*Tailscale*" } |
                   Select-Object -First 1
          if ($tsReg) {
              Start-Process msiexec.exe -ArgumentList "/x", $tsReg.PSChildKey, "/quiet", "/norestart" -Wait
              Write-Host "Tailscale uninstalled."
          } else {
              Write-Host "Tailscale not found, skipping."
          }

      - name: Cleanup Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "`n=== CLEANUP COMPLETE ==="
          Write-Host "✅ Tailscale disconnected and logged out"
          Write-Host "✅ RDP user removed"
          Write-Host "✅ Firewall rule removed"
          Write-Host "✅ RDP disabled"
          Write-Host "✅ Tailscale uninstalled"
          Write-Host "========================`n"
